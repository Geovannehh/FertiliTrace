services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fertilitrace
      POSTGRES_USER: fertilitrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - fertilitrace_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fertilitrace -d fertilitrace"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://fertilitrace:${POSTGRES_PASSWORD}@postgres:5432/fertilitrace
      API_TOKEN: ${API_TOKEN:?Configure API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8000'
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:?Configure API_TOKEN}
      NGINX_ENVSUBST_FILTER: API_TOKEN
    ports:
      - '3000:80'
    depends_on:
      - api
volumes:
  fertilitrace_db:
